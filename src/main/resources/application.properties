spring.application.name=${MCP_SERVER_NAME:jira-mcp-server}
spring.main.banner-mode=off
spring.main.web-application-type=none
spring.main.log-startup-info=false

spring.ai.mcp.server.name=${MCP_SERVER_NAME:jira-mcp-server}
spring.ai.mcp.server.version=${MCP_SERVER_VERSION:1.0.0}
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.annotation-scanner.enabled=false

jira.base-url=${JIRA_BASE_URL:https://jira.example.com}
jira.username=${JIRA_USERNAME:}
jira.password=${JIRA_PASSWORD:}
jira.cookie=${JIRA_COOKIE:}
jira.sprint-field-id=${JIRA_SPRINT_FIELD_ID:customfield_10007}
jira.related-prd-field-id=${JIRA_RELATED_PRD_FIELD_ID:customfield_10005}
