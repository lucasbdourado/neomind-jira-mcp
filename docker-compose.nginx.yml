services:
  jira-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: jira-mcp-server:latest
    container_name: jira-mcp-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      MCP_ENDPOINT: "/mcp"
    networks:
      - mcp-internal

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-mcp-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      - mcp-internal
    depends_on:
      - jira-mcp-server

networks:
  mcp-internal:
    driver: bridge
