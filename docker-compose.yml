services:
  jira-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: jira-mcp-server:latest
    container_name: jira-mcp-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      MCP_ENDPOINT: "/mcp"
    networks:
      - mcp-internal
    # No host port exposed - isolated in private bridge network

  caddy:
    image: caddy:2.9-alpine
    container_name: caddy-mcp-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mcp-internal
    depends_on:
      - jira-mcp-server

networks:
  mcp-internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
